[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-canary"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
ui = ["fastapi==0.141.1", "python-dotenv==1.2.3", "uvicorn==0.52.4"]
experiment = ["flagsmith==6.3.0"]

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.uv]
package = false


